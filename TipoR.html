<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrucción Tipo R - Datapath</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>Flujo de Datos: Tipo R</h1>
        <p><a href="index.html" style="color: white; text-decoration: underline;">Volver al Inicio</a></p>
    </header>

    <div class="contenedor">
        <div class="tarjeta">
            <h2>Mapa del Datapath (Tipo R)</h2>
            <!-- Aquí pones tu imagen con la ruta del Tipo R resaltada -->
            <img src="Imagenes/TipoR.png" class="imagen-instruccion" alt="Ruta resaltada Tipo R">
            
            <div class="panel-control">
                <label>Operación:</label>
                <select id="operacion">
                    <option value="suma">ADD (Suma)</option>
                    <option value="resta">SUB (Resta)</option>
                </select>

                <label>Valor RS:</label>
                <input type="number" id="valor_rs" value="15">

                <label>Valor RT:</label>
                <input type="number" id="valor_rt" value="10">

                <label>Registro Destino (RD):</label>
                <input type="text" id="reg_rd" value="$t0">

                <button class="btn-ejecutar" onclick="ejecutarTipoR()">Ejecutar Flujo</button>
            </div>

            <h3>Estado de las Señales de Control</h3>
            <table>
                <tr>
                    <th>RegDst</th>
                    <th>ALUSrc</th>
                    <th>MemToReg</th>
                    <th>RegWrite</th>
                    <th>MemRead</th>
                    <th>MemWrite</th>
                    <th>Branch</th>
                </tr>
                <tr>
                    <td id="s_regdst">-</td>
                    <td id="s_alusrc">-</td>
                    <td id="s_memtoreg">-</td>
                    <td id="s_regwrite">-</td>
                    <td id="s_memread">-</td>
                    <td id="s_memwrite">-</td>
                    <td id="s_branch">-</td>
                </tr>
            </table>

            <div id="texto-explicacion" class="texto-flujo" style="display: none;">
                <!-- Aquí se inyectará el texto descriptivo con JavaScript -->
            </div>
        </div>
    </div>

    <script>
        function ejecutarTipoR() {
            // 1. Obtener los valores que ingresó el usuario
            const operacion = document.getElementById("operacion").value;
            const rs = parseInt(document.getElementById("valor_rs").value);
            const rt = parseInt(document.getElementById("valor_rt").value);
            const rd = document.getElementById("reg_rd").value;

            // 2. Calcular el resultado de la ALU
            let resultadoALU = 0;
            let nombreOperacion = "";
            
            if (operacion === "suma") {
                resultadoALU = rs + rt;
                nombreOperacion = "sumó";
            } else {
                resultadoALU = rs - rt;
                nombreOperacion = "restó";
            }

            // 3. Actualizar la tabla de señales de control (Valores fijos para Tipo R)
            document.getElementById("s_regdst").innerText = "1";
            document.getElementById("s_alusrc").innerText = "0";
            document.getElementById("s_memtoreg").innerText = "0";
            document.getElementById("s_regwrite").innerText = "1";
            document.getElementById("s_memread").innerText = "0";
            document.getElementById("s_memwrite").innerText = "0";
            document.getElementById("s_branch").innerText = "0";

            // 4. Crear el texto dinámico paso a paso
            const textoDiv = document.getElementById("texto-explicacion");
            textoDiv.style.display = "block";
            textoDiv.innerHTML = `
                <strong>Flujo actual:</strong><br><br>
                1. La Unidad de Control detecta el opcode y activa <b>RegDst=1</b> y <b>RegWrite=1</b>.<br>
                2. El Banco de Registros lee los valores de entrada: <b>RS = ${rs}</b> y <b>RT = ${rt}</b>.<br>
                3. Como <b>ALUSrc=0</b>, ambos valores pasan directamente a la ALU.<br>
                4. La ALU recibe la señal de control y <b>${nombreOperacion}</b> los valores: (${rs} y ${rt}) dando como resultado <b>${resultadoALU}</b>.<br>
                5. Como <b>MemToReg=0</b>, el resultado de la ALU (${resultadoALU}) esquiva la Memoria de Datos y viaja por el cable inferior de regreso al Banco de Registros.<br>
                6. El valor <b>${resultadoALU}</b> se guarda exitosamente en el registro destino <b>${rd}</b>.
            `;
        }
    </script>
</body>
</html>
